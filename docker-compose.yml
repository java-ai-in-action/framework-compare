version: "3.9"

# 一键起 framework-compare 所需基础设施
# 用法: docker-compose up -d

services:
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: javaai-pgvector
    environment:
      POSTGRES_USER: javaai
      POSTGRES_PASSWORD: javaai123
      POSTGRES_DB: javaai
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U javaai"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: javaai-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis/redis-stack-server:latest
    container_name: javaai-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  pgvector_data:
  qdrant_data:
  redis_data:
