server:
  port: 8080

spring:
  application:
    name: spring-ai-quickstart
  ai:
    openai:
      # OpenAI 协议通用：DeepSeek 改 https://api.deepseek.com，通义改 https://dashscope.aliyuncs.com/compatible-mode/v1
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      api-key: ${OPENAI_API_KEY:sk-demo}
      chat:
        options:
          model: ${CHAT_MODEL:gpt-4o-mini}
          temperature: 0.7

    # ──────────────────────────────────────────────────────────────
    # Step 4：MCP Client 配置（默认注释，需要时取消注释 + 在 pom.xml 引入
    #         spring-ai-starter-mcp-client 依赖）
    #
    # 本地 stdio 方式（需已安装 Node.js）：
    # mcp:
    #   client:
    #     stdio:
    #       connections:
    #         filesystem:
    #           command: npx
    #           args:
    #             - "-y"
    #             - "@modelcontextprotocol/server-filesystem"
    #             - "/data"
    #
    # 远程 Streamable HTTP 方式：
    # mcp:
    #   client:
    #     streamable-http:
    #       connections:
    #         remote-tools:
    #           url: https://your-mcp-server.com/mcp
    # ──────────────────────────────────────────────────────────────

logging:
  level:
    org.springframework.ai: INFO
