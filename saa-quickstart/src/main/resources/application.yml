server:
  port: 8082

spring:
  application:
    name: saa-quickstart
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:sk-demo}
      chat:
        options:
          model: ${CHAT_MODEL:qwen-plus}
          temperature: 0.7

logging:
  level:
    org.springframework.ai: INFO
    com.alibaba.cloud.ai: INFO
